let filmes=filmesBase;let generos=GENEROS_PADRAO;
function render(){let c=document.getElementById('containerPastas');c.innerHTML='';generos.forEach(g=>{let lista=filmes.filter(f=>f.pasta===g);if(lista.length===0)return;let h=`<div class="row-title">${g} (${lista.length})</div><div class="row">`;lista.forEach(f=>{let i=filmes.indexOf(f);h+=`<div class="card"><img src="${f.i}" onclick="play(${i})"><div>${f.t}</div></div>`});h+=`</div>`;c.innerHTML+=h;});}
function play(i){document.getElementById('player').style.display='block';document.getElementById('frame').src=filmes[i].l;}
function fecharPlayer(){document.getElementById('player').style.display='none';document.getElementById('frame').src='';}
function filtrar(){let q=document.getElementById('busca').value.toLowerCase();if(!q){render();return}let c=document.getElementById('containerPastas');let l=filmes.filter(f=>f.t.toLowerCase().includes(q));let h=`<div class="row-title">Resultado (${l.length})</div><div class="row">`;l.forEach(f=>{let i=filmes.indexOf(f);h+=`<div class="card"><img src="${f.i}" onclick="play(${i})"><div>${f.t}</div></div>`});c.innerHTML=h+`</div>`;}

document.getElementById('modalLote').style.display='flex';
}
function fecharLote(){document.getElementById('modalLote').style.display='none';document.getElementById('resultadoLote').style.display='none';}

function extrairID(url){
let id=null;
