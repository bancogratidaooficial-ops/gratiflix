<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRATIFLIX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#141414;color:#fff;font-family:Arial}
header{padding:10px 2%;background:#000;position:fixed;width:100%;top:0;z-index:100;display:flex;justify-content:space-between;flex-wrap:wrap;gap:5px}
.logo{color:#e50914;font-size:24px;font-weight:900}
.actions{display:flex;gap:4px;flex-wrap:wrap}
.actions button{border:none;padding:8px 8px;border-radius:4px;font-weight:800;cursor:pointer;font-size:8px}
.btn-green{background:#00c851;color:#fff}.btn-blue{background:#007feb;color:#fff}.btn-yellow{background:#ffcc00;color:#000}.btn-orange{background:#ff8c00;color:#000}.btn-pink{background:#ff006a;color:#fff}.btn-purple{background:#6c00ff;color:#fff}
.search{margin-top:68px;padding:10px 2%;background:#0a0a0a;display:flex;gap:6px;position:fixed;width:100%;z-index:90}
.search input{flex:1;padding:11px;border-radius:4px;border:none;background:#222;color:#fff}
.row-title{font-size:16px;margin:20px 0 8px 2%;font-weight:800;border-left:4px solid #e50914;padding-left:8px}
.row{display:flex;gap:8px;overflow-x:auto;padding:0 2% 12px}
.card{min-width:145px;max-width:145px;background:#222;border-radius:6px;overflow:hidden;position:relative;padding-bottom:28px}
.card img{width:100%;height:160px;object-fit:cover;cursor:pointer}
.card.titulo{padding:5px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.botoes{position:absolute;bottom:0;left:0;width:100%;display:flex;background:rgba(0,0,0,.9)}
.card.botoes span{flex:1;text-align:center;padding:6px 0;font-size:12px;cursor:pointer}
#player{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:none}#player iframe{width:100%;height:100%;border:none}
#modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);z-index:10000;display:none;align-items:center;justify-content:center;padding:10px}
.box{background:#181818;border-radius:10px;padding:14px;width:100%;max-width:500px;border:1px solid #333;max-height:90vh;overflow:auto}
.box input,.box textarea{width:100%;padding:10px;border-radius:4px;border:none;background:#222;color:#fff;margin-bottom:6px}textarea{height:100px}
</style>
</head>
<body>
<header>
<div class="logo">GRATIFLIX</div>
<div class="actions">
<button class="btn-green" onclick="addYT()">+ LINK YT</button>
<button class="btn-blue" onclick="addPasta()">+ PASTA</button>
<button class="btn-yellow" onclick="abrirArquivo()">📁 ARQUIVO</button>
<button class="btn-orange" onclick="salvarFixo()">💾 FIXO</button>
<button class="btn-pink" onclick="compartilharSite()">📤 COMPARTILHAR</button>
<button class="btn-purple" onclick="convidar()">👥 CONVIDAR</button>
<button style="background:#333;color:#fff;border:none;padding:8px;border-radius:4px;font-weight:800" onclick="localStorage.clear();location.reload()">↻</button>
</div>
</header>

<div class="search"><input id="busca" placeholder="🔍 Buscar filme..." oninput="filtrar()"><button onclick="filtrar()" style="padding:11px 12px;border:none;background:#e50914;color:#fff;font-weight:900">🔍</button></div>

<div style="margin-top:118px;padding:18px 2%;background:#000"><h1><span style="color:#e50914">GRATI</span>FLIX - 72 filmes + TV</h1><p style="font-size:12px;color:#aaa">Toque no ✏️ pra mudar nome e no 📤 pra compartilhar</p></div>

<div id="lista"></div>

<div id="player">
<button onclick="fechar()" style="position:absolute;top:10px;left:10px;background:#e50914;color:#fff;border:none;padding:9px 14px;border-radius:6px;z-index:10002;font-weight:800">↩ VOLTAR</button>
<button onclick="modoTV()" style="position:absolute;top:10px;right:10px;background:#007feb;color:#fff;border:none;padding:9px 14px;border-radius:6px;z-index:10002;font-weight:900">📺 TV</button>
<iframe id="frame" allowfullscreen allow="autoplay"></iframe>
</div>

<div id="modal"><div class="box" id="boxConteudo"></div></div>

let extras=JSON.parse(localStorage.getItem('grati_extras')||'[]');
let filmes=[...filmesBase,...extras];
function getID(u){u=u.trim();let id='';if(u.includes('youtu.be/'))id=u.split('youtu.be/')[1];else if(u.includes('v='))id=u.split('v=')[1];else if(u.includes('embed/'))id=u.split('embed/')[1];else id=u;return id.split('?')[0].split('&')[0].split('/')[0].substring(0,11);}
function render(){
let c=document.getElementById('lista');c.innerHTML='';
let todos=[...new Set([...GENEROS,...filmes.map(f=>f.pasta)])];
todos.forEach(g=>{
let lista=filmes.filter(f=>f.pasta===g);if(!lista.length)return;
let h=`<div class="row-title">${g} (${lista.length})</div><div class="row">`;
lista.forEach(f=>{
let idx=filmes.indexOf(f);
h+=`<div class="card"><img src="${f.i}" onclick="play(${idx})"><div class="titulo">${f.t}</div>
<div class="botoes">
<span onclick="editar(${idx})">✏️</span>
<span onclick="compartilhar(${idx})">📤</span>
<span onclick="del(${idx})">🗑️</span>
</div></div>`;
});h+=`</div>`;c.innerHTML+=h;
});
}
function play(i){document.getElementById('player').style.display='block';document.getElementById('frame').src=filmes[i].l;}
function fechar(){
document.getElementById('player').style.display='none';document.getElementById('frame').src='';
document.querySelector('header').style.display='flex';document.querySelector('.search').style.display='flex';document.getElementById('lista').style.display='block';
}
function modoTV(){
const f=document.getElementById('frame');if(!f.src)return alert('Abra um filme!');
document.querySelector('header').style.display='none';document.querySelector('.search').style.display='none';document.getElementById('lista').style.display='none';
alert('📺 MODO TV LIGADO!\n\n1. Deslize o dedo de cima pra baixo\n2. Clique em Smart View / Transmitir\n3. Escolha sua TV');
}
function filtrar(){let q=document.getElementById('busca').value.toLowerCase();if(!q){render();return;}let res=filmes.filter(x=>x.t.toLowerCase().includes(q));let c=document.getElementById('lista');let h=`<div class="row-title">Resultado (${res.length})</div><div class="row">`;res.forEach(fi=>{let idx=filmes.indexOf(fi);h+=`<div class="card"><img src="${fi.i}" onclick="play(${idx})"><div class="titulo">${fi.t}</div><div class="botoes"><span onclick="editar(${idx})">✏️</span><span onclick="compartilhar(${idx})">📤</span><span onclick="del(${idx})">🗑️</span></div></div>`});c.innerHTML=h+`</div>`;}
function editar(i){
let atual=filmes[i].t;
let novo=prompt('✏️ Mudar nome:',atual);
if(novo && novo.trim()!==''){
filmes[i].t=novo.trim();
if(extras.includes(filmes[i]) || filmes.indexOf(filmes[i])>=filmesBase.length){
localStorage.setItem('grati_extras',JSON.stringify(filmes.filter(f=>!filmesBase.includes(f))));
} else {
// se for da base, salva nos extras como editado
extras.push(filmes[i]);
localStorage.setItem('grati_extras',JSON.stringify(extras));
}
render();
}
}
function del(i){if(confirm('🗑️ Apagar "'+filmes[i].t+'"?')){let obj=filmes[i];filmes.splice(i,1);extras=filmes.filter(f=>!filmesBase.find(b=>b.l===f.l && b.t===f.t));localStorage.setItem('grati_extras',JSON.stringify(extras));render();}}
function compartilhar(i){
let link=filmes[i].l;
if(navigator.share){navigator.share({title:filmes[i].t,text:'Assista no GRATIFLIX: '+filmes[i].t,url:link});}
else{navigator.clipboard.writeText(link);alert('📤 Link copiado!\n'+link);}
}
