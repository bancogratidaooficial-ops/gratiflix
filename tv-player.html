<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TV Player - GRATIFLIX</title>
<style>body{margin:0;background:#000;display:flex;align-items:center;justify-content:center;height:100vh}iframe{width:100%;height:100%;border:none}</style>
</head><body>
<script>
const url = new URLSearchParams(location.search).get('url');
if(url) document.body.innerHTML = `<iframe src="${url}" allowfullscreen allow="autoplay"></iframe>`;
else document.body.innerHTML = '<h1 style="color:#fff">Abra pelo GRATIFLIX</h1>';
</script>
</body></html>
